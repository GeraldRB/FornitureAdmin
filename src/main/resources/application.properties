spring.application.name=forniture
server.port=91

# Thymeleaf sin caché
spring.thymeleaf.cache=false

# Recursos estáticos sin caché
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# Conexión a MySQL local
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Valida las tablas existentes sin modificar su estructura
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

# Firebase Storage
firebase.bucket.name=muebles-palmares-gera.firebasestorage.app
firebase.storage.path=MPG/Images
firebase.json.path=firebase
firebase.json.file=muebles-palmares-gera-firebase-adminsdk-fbsvc-d6ffd33ec8.json

# Puerto del servidor
#server.port=${PORT:8080}