<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">

    <head>
        <meta charset="UTF-8"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <link rel="stylesheet" th:href="@{/css/citas.css}"/>
        <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
        <title>[[#{login.inicioSession}]]</title>
    </head>

    <body class="bg">
        <!-- Navbar -->
        <th:block th:replace="~{general/fragmentos :: navbar}"></th:block>

        <main class="shadow p-2 mt-0 ">
            <div class="container py-4 d-flex flex-column align-items-center">
                <h1 class="fw-bold color-azul"></h1>
                <p class="lead titulo-terciario"></p>
            </div>

            <!-- Tarjeta de Login -->
            <div class="card p-4 shadow-lg mb-4 mx-auto mt-3" style="max-width: 420px; border-radius: 20px;">
                <div class="text-center mb-3">
                    <img th:src="@{/img/Logo2.png}" alt="logo2" class="logo-card">
                </div>

                <h4 class="text-center color-azul fw-semibold mb-4">[[#{login.inicioSession}]]</h4>

                <form method="POST" th:action="@{/login}">
                    
                    <!-- Usuario -->
                    <div class="mb-4">
                        <label for="username" class="form-label fw-semibold color-azul">[[#{login.CorreoElectronico}]]</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person color-azul"></i></span>
                            <input class="form-control" id="username" name="username" type="text" 
                                   th:placeholder="#{login.username}" required>
                        </div>
                    </div>

                    <!-- Contraseña -->
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold color-azul">[[#{login.Contrasenna}]]</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock color-azul"></i></span>
                            <input class="form-control" id="password" name="password" type="password" 
                                   th:placeholder="#{login.password}" required>
                        </div>
                    </div>

                    <!-- Botón principal -->
                    <button class="btn btn-success w-100 py-2 fw-semibold mb-4" type="submit">
                        <i class="fas fa-sign-in-alt"></i> [[#{login.inicioSession}]]
                    </button>

                    <!-- Links secundarios -->
                    <div class="text-center mb-3">
                        <a href="#" class="text-decoration-none color-azul d-block mb-3">
                            [[#{login.OlvidoContrasenna}]]
                        </a>
                        <a href="#" class="text-decoration-none color-azul fw-semibold ">
                            [[#{login.Formulario}]]
                        </a>
                    </div>

                </form>
            </div>
        </main>

        <!-- Footer -->
        <footer th:replace="~{general/fragmentos :: footer}"></footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
        <script>
            AOS.init({
                duration: 800, 
                once: true    
            });
        </script>

    </body>

</html>
